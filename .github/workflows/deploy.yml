name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Установить зависимости
        run: npm install

      - name: Проверить JavaScript
        run: npm run check

      - name: Собрать сайт
        run: npm run build

      - name: Загрузить сайт для GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
